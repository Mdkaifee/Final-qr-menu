services:
  postgres:
    image: postgres:16-alpine
    container_name: millenium_qr_postgres
    environment:
      POSTGRES_DB: millenium_qr
      POSTGRES_USER: millenium
      POSTGRES_PASSWORD: millenium_dev_password
    ports:
      - "5432:5432"
    volumes:
      - millenium_qr_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U millenium -d millenium_qr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: millenium_qr_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  millenium_qr_postgres:
